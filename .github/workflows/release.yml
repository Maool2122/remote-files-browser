name: Release

# A release is made from a tag "vX.Y.Z", where X.Y.Z is the version of the helper program (version in helper/server.go).
# The workflow checks the code and the documents, builds the six helper programs, writes one file of checksums, records
# where everything was built (a build attestation) and makes a DRAFT release. A maintainer reads the draft and presses
# "Publish". The workflow does not sign the programs and uploads them nowhere else (docs/RELEASING.md).
#
# Started by hand from the Actions tab, it is a trial run: it builds everything and keeps the files for a week, and makes no release.

on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Check the version and the code (Windows)
    runs-on: windows-latest
    timeout-minutes: 30
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Get the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Install Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
          check-latest: true
          cache-dependency-path: helper/go.sum

      - name: Read the version, and check that the tag says the same
        id: version
        shell: bash
        run: |
          version="$(node tools/release-notes.mjs --version)"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [ "$GITHUB_REF_TYPE" = "tag" ] && [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::The tag is $GITHUB_REF_NAME, but helper/server.go says version $version."
            exit 1
          fi

      - name: Documents (links, anchors, versions)
        run: node tools/check-docs.mjs

      - name: Scope (only the helper, its documents and its tools)
        run: node tools/check-scope.mjs

      - name: Is this version ready? (CHANGELOG entry, the same version everywhere)
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: node tools/release-notes.mjs --check "v$VERSION"

      - name: Helper gofmt
        shell: bash
        working-directory: helper
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "::error::These files are not formatted. Run gofmt -w . in helper/ :"
            echo "$unformatted"
            exit 1
          fi

      - name: Helper go vet
        working-directory: helper
        run: go vet ./...

      - name: Helper go test
        working-directory: helper
        run: go test -count=1 ./...

  helper:
    name: Build the helper programs
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      go: ${{ steps.go.outputs.version }}
    steps:
      - name: Get the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The newest patch release of Go: the Go standard library is part of the program (docs/VERIFYING-DOWNLOADS.md).
      - name: Install Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
          check-latest: true
          cache-dependency-path: helper/go.sum

      - name: Install Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Note the Go version
        id: go
        run: echo "version=$(go env GOVERSION)" >> "$GITHUB_OUTPUT"

      - name: Build the six programs
        run: node helper/build.mjs

      - name: Check that all six are there
        run: |
          ls -l helper/dist
          test "$(ls helper/dist/rocuo-files-helper-* | wc -l)" -eq 6

      - name: Keep the programs
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: helper-programs
          path: helper/dist/rocuo-files-helper-*
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Make the draft release
    if: github.ref_type == 'tag'
    needs: [verify, helper]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write # to make the draft release
      id-token: write # to sign the build attestation
      attestations: write # to store the build attestation
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      VERSION: ${{ needs.verify.outputs.version }}
    steps:
      - name: Get the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Get the helper programs
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: helper-programs
          path: assets

      - name: Write the checksums
        working-directory: assets
        run: |
          ls -l
          sha256sum rocuo-files-helper-* > SHA256SUMS.txt
          cat SHA256SUMS.txt
          sha256sum -c SHA256SUMS.txt

      - name: Record where the files were built (build attestation)
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: assets/*

      - name: Write the release notes
        env:
          GO_VERSION: ${{ needs.helper.outputs.go }}
        run: |
          node tools/release-notes.mjs "$VERSION" > notes.md
          {
            echo
            echo "---"
            echo
            echo "Built by [this workflow run]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID) from commit \`$GITHUB_SHA\`, with $GO_VERSION."
            echo
            echo "Check a download: \`SHA256SUMS.txt\` has the checksum of every file, and \`gh attestation verify FILE --repo $GITHUB_REPOSITORY\` shows where it was built. How, step by step: [docs/VERIFYING-DOWNLOADS.md]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/blob/$GITHUB_REF_NAME/docs/VERIFYING-DOWNLOADS.md). The helper programs are not signed yet."
          } >> notes.md
          cat notes.md

      # A draft: nobody sees it until a maintainer has read it and pressed "Publish release".
      - name: Make the draft release
        run: |
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" assets/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" assets/* --draft --verify-tag --title "Remote Files Browser FTP helper $VERSION" --notes-file notes.md
          fi
